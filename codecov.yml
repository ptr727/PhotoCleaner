# Codecov configuration.
#
# Coverage is report-only for this repo: the patch and project statuses are
# informational so a coverage delta never blocks a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The benchmarks project is a performance harness, not shipped app code, and is
# intentionally not unit-tested.
ignore:
  - "PhotoCleanerBenchmarks/**"
