# Codecov configuration.
# Codecov's coverage statuses are advisory: they report and trend coverage, never gating a PR.
# - informational: true makes project and patch statuses advisory (always pass), so a coverage delta never blocks a PR.
# - Distinct from the upload step's fail_ci_if_error: false, which only guards upload errors.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The benchmarks project is a performance harness rather than shipped app code, and is intentionally not unit-tested.
# Microsoft.Testing.Extensions.CodeCoverage also instruments the source generators' output, which lands under obj.
# That output is build product rather than reviewed source, and exists in no checkout Codecov can map a path to.
ignore:
  - "PhotoCleanerBenchmarks/**"
  - "**/obj/**"
