name: Pre-test hook
description: Install ExifTool and FFmpeg so the media tests run against real tools rather than skip.

runs:
  using: composite
  steps:

    - name: Install ExifTool and FFmpeg step
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libimage-exiftool-perl ffmpeg
        echo "exiftool version $(exiftool -ver)"
        ffmpeg -hide_banner -version
