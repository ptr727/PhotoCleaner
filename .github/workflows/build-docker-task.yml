name: Build Docker image task

# Builds the image (multi-arch on main, amd64 on develop/smoke) and, on a main publish, pushes it plus the Docker Hub overview.
# Branch drives config and tags: main => Release/`latest`, else Debug/`develop`, plus the `:SemVer2` tag. Smoke builds
# amd64 only and never pushes; registry buildcache is branch-scoped. The orchestrator passes `branch` explicitly
# (the publisher builds one branch per run - the trigger ref - and smoke passes github.ref_name).
on:
  workflow_call:
    inputs:
      # Push the built image and the Docker Hub overview.
      push:
        required: false
        type: boolean
        default: false
      # Git ref to check out / version (empty = default checkout ref).
      ref:
        required: false
        type: string
        default: ''
      # Logical branch: main => Release/`latest`, else Debug/`develop`. Required (see header).
      branch:
        required: true
        type: string
      # Smoke: build linux/amd64 only, never push, skip the shared cache-to. Fast PR feedback.
      smoke:
        required: false
        type: boolean
        default: false
      # Version from the orchestrator's single NBGV run (threaded). This task does not
      # re-run NBGV on the detached commit, which could classify the branch differently.
      semver2:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      assembly_file_version:
        required: true
        type: string
      assembly_informational_version:
        required: true
        type: string

jobs:

  build-docker:
    name: Build Docker image job
    runs-on: ubuntu-latest
    env:
      # Multi-arch (amd64+arm64) only on a full main publish; smoke and develop build amd64 only.
      PLATFORMS: ${{ (!inputs.smoke && inputs.branch == 'main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

    steps:

      - name: Checkout step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # arm64 is non-native on the amd64 runner, so install its QEMU emulator only when the build includes it.
      - name: Setup QEMU step
        if: ${{ contains(env.PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Setup Buildx step
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: ${{ env.PLATFORMS }}

      # Always login (even on smoke) for higher pull/cache-read rate limits; the credentials are in both the
      # Actions and Dependabot secret stores so a Dependabot push CI run can log in too. Forks cannot push here.
      - name: Login to Docker Hub step
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker build and push step
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ inputs.push }}
          file: ./Docker/Dockerfile
          tags: |
            docker.io/ptr727/photocleaner:${{ inputs.branch == 'main' && 'latest' || 'develop' }}
            docker.io/ptr727/photocleaner:${{ inputs.semver2 }}
          platforms: ${{ env.PLATFORMS }}
          # Read both branches' caches (near-identical layers), write only this branch's tag and only when pushing.
          # mode=max caches the builder publish; ignore-error keeps a cache hiccup from failing a publish.
          cache-from: |
            type=registry,ref=docker.io/ptr727/photocleaner:buildcache-main
            type=registry,ref=docker.io/ptr727/photocleaner:buildcache-develop
          cache-to: ${{ inputs.push && format('type=registry,ref=docker.io/ptr727/photocleaner:buildcache-{0},mode=max,ignore-error=true', inputs.branch) || '' }}
          build-args: |
            LABEL_VERSION=${{ inputs.semver2 }}
            BUILD_CONFIGURATION=${{ inputs.branch == 'main' && 'Release' || 'Debug' }}
            BUILD_VERSION=${{ inputs.assembly_version }}
            BUILD_FILE_VERSION=${{ inputs.assembly_file_version }}
            BUILD_ASSEMBLY_VERSION=${{ inputs.assembly_version }}
            BUILD_INFORMATION_VERSION=${{ inputs.assembly_informational_version }}
            BUILD_PACKAGE_VERSION=${{ inputs.semver2 }}

      # Docker Hub's short description mirrors the README intro line (GOVERNANCE.md "Repository Details"), so read it
      # from the file rather than restating it here: a literal in this workflow would be one more surface to drift.
      # Strip CR first, since README.md is CRLF and a bare CR makes awk read the blank line 2 as non-empty.
      - name: Read short description step
        id: short-description
        if: ${{ inputs.push && inputs.branch == 'main' }}
        run: |
          set -Eeuo pipefail
          # Trim at extraction so every check below reads the same normalized value. CommonMark allows up to three
          # leading spaces before a heading or list marker, so an indented '## ...' would slip past the structure
          # check and ship as the tagline; trailing space would pad the published string.
          INTRO=$(tr -d '\r' < README.md | awk 'NR>1 && NF { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit }')
          # Fail loud rather than pushing a wrong tagline: a restructured README that moves the intro would
          # otherwise silently publish whatever follows the H1 on the next publish.
          if [[ -z "$INTRO" ]]; then
            echo "::error::No intro line found after the README H1; cannot set the Docker Hub short description."
            exit 1
          fi
          # An empty README is not the realistic failure. Deleting or moving the intro is, and then the line picked
          # up is the next construct (a '## ...' heading here), which is non-empty and under the cap, so the checks
          # above and below both pass and a heading ships as the tagline. Reject anything opening a markdown block.
          case "$INTRO" in
            '#'* | '>'* | '-'* | '*'* | '+'* | '<'* | '|'* | '`'* | '~'* | '['* | '!'*)
              echo "::error::Line after the README H1 is markdown structure, not the intro sentence: '$INTRO'"
              exit 1
              ;;
          esac
          # An ordered list opens with digits then '.' or ')' then a space, which no intro sentence does. Matched
          # as a regex rather than a case glob, since a glob cannot express "one or more digits" without also
          # swallowing an ordinary sentence that happens to start with a number. The pattern is held in a variable
          # because bash fails to parse a ')' inside a bracket expression written inline after =~.
          ordered_list_re='^[0-9]+[.)][[:space:]]'
          if [[ "$INTRO" =~ $ordered_list_re ]]; then
            echo "::error::Line after the README H1 is an ordered list item, not the intro sentence: '$INTRO'"
            exit 1
          fi
          # spec/readme-structure.md requires the intro to be link-free plain text, and neither Docker Hub nor the
          # GitHub About panel renders markdown, so a link would ship as its raw source.
          if [[ "$INTRO" == *']('* || "$INTRO" == *']['* ]]; then
            echo "::error::README intro contains a link; the short description must be plain text: '$INTRO'"
            exit 1
          fi
          if (( ${#INTRO} > 100 )); then
            echo "::error::README intro is ${#INTRO} characters; Docker Hub caps the short description at 100."
            exit 1
          fi
          echo "intro=$INTRO" >> "$GITHUB_OUTPUT"

      # Push the trimmed Docker Hub overview from Docker/README.md, main only (one overview, no per-branch context).
      - name: Update Docker Hub description step
        if: ${{ inputs.push && inputs.branch == 'main' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: ptr727/photocleaner
          readme-filepath: ./Docker/README.md
          short-description: ${{ steps.short-description.outputs.intro }}
