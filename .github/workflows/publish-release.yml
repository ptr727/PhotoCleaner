name: Publish project release action

# Scheduled + on-demand publisher, one run = one branch (the trigger ref). The weekly schedule rebuilds
# `main` only (native binaries + multi-arch Docker image + GitHub release; refreshes the `latest` image and
# its `dotnet/runtime:10.0-alpine` base for CVEs). A manual dispatch publishes the branch it is started from (main =>
# stable/`latest`, develop => prerelease/`develop`). Building only the trigger branch keeps github.ref aligned
# with the branch being versioned, so NBGV classifies it correctly with no matrix and no cross-branch ref leak.
#
# Merges do NOT publish: accumulated changes (mostly Dependabot bumps) ship in the next scheduled run.
# To release develop, dispatch this workflow from the develop branch.
# CI/validation runs separately in test-pull-request.yml on pull request.
# This workflow never runs on push or pull request.
#
# Thin caller onto the hub's reusable plan, validate, and build-release tasks, per ptr727/ProjectTemplate docs/reusable-workflows.md "Adopting the Release Chain".
# The plan job centralizes the release-gate decision this workflow's own trigger already narrows to main/develop, so publish keeps the same behavior as before adoption.
on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild/publish of main (Mon 02:00 UTC) to pick up base-image updates.
    - cron: '0 2 * * MON'

# The publisher exception to the concurrency convention: ref-scoped and never cancelled, since a cancelled publish can leave a partial tag set or a half-created release.
# No push trigger exists and the schedule always publishes, so no run needs a per-run github.run_id suffix to keep from replacing a pending publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # Single source of the release-gate decision (whether to publish, and whether the channel is stable), reused by every job below.
  # A dispatch publishes only main or develop.
  # The schedule always publishes, matching this workflow's own trigger.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@07b0a520b47e850ac1b26ab47f83843a56a99461 # 2.0.1090
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate the pull request runs, on the branch tip.
  # It runs only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@07b0a520b47e850ac1b26ab47f83843a56a99461 # 2.0.1090
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Publish the trigger branch in full (native binaries + Docker + GitHub release). The schedule always runs on
  # the default branch (main); a dispatch runs on whatever branch it is started from. build-release-task
  # validates, versions, and tags that one branch; the no-op guard skips release creation when the version is
  # unchanged while the Docker push still refreshes the base image.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: >-
      ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@07b0a520b47e850ac1b26ab47f83843a56a99461 # 2.0.1090
    permissions:
      contents: write
      # actions: write lets the reusable github-release job delete its release-asset-* transfer artifacts (D5.1).
      actions: write
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      # Pin to the exact triggering commit (not the moving branch tip) so get-version, the builds, and the release
      # tag all use one commit even if the branch advances mid-run. branch stays the logical name for config/tags.
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      dockerhub: true
      enable_docker: true
      enable_dotnet_publish: true
      enable_nuget: false
      enable_pypi: false
      docker_image: ptr727/photocleaner
      dotnet_publish_project: ./PhotoCleaner/PhotoCleaner.csproj

  # The hub task pushes only on main, so a develop run reaches it as a no-op.
  publish-docker-readme:
    name: Publish Docker Hub readme job
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ptr727/ProjectTemplate/.github/workflows/publish-docker-readme-task.yml@07b0a520b47e850ac1b26ab47f83843a56a99461 # 2.0.1090
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      repositories: '["ptr727/photocleaner"]'
