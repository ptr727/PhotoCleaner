name: Test pull request action

# Thin caller onto the hub's reusable validate-task.yml and build-release-task.yml.
# This is the release-with-smoke shape from ptr727/ProjectTemplate docs/reusable-workflows.md "Adopting the Gates".
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # The repo builds one combined release target, executable plus Docker image.
  # One filter entry excludes a workflow-only change from the smoke build rather than separating targets the repo does not have.
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Full history: a pull_request run reads the changed-files list from the GitHub API and needs no history.
      # A workflow_dispatch run has no PR to query, so dorny/paths-filter diffs locally against the default branch instead.
      # A shallow checkout could leave it with no common ancestor to diff from.
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - '!.github/workflows/**'

  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@b823bc493fcdc47e9d9d9d2fc183e3ca10114146 # main promotion
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Never publishes and never uploads (D1.3): smoke: true disables every publish path in build-release-task.
  # The enable_nuget and enable_pypi inputs are false, since this repo carries neither leaf.
  # The Docker Hub secrets are mapped even on smoke, since the hub task logs in to Docker Hub on every build for the higher rate limit.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@b823bc493fcdc47e9d9d9d2fc183e3ca10114146 # main promotion
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      enable_docker: true
      enable_dotnet_publish: true
      enable_nuget: false
      enable_pypi: false
      docker_image: ptr727/photocleaner
      dotnet_publish_project: ./PhotoCleaner/PhotoCleaner.csproj
      # On a pull_request event github.ref_name is the PR ref (for example 123/merge), never the target branch.
      # The logical branch reads base_ref first and only falls back to ref_name on a non-PR trigger.
      branch: ${{ github.base_ref || github.ref_name }}

  # Treats a skipped smoke-build (an unchanged target) as pass, and blocks on failure or cancelled (D1.5, D7.4).
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" && "$value" != "skipped" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
