name: Test pull request action

# CI for every branch. Runs on push so the reusable validate-task resolves from the pushed head: a PR that
# edits a workflow tests its own copy. The aggregator below is the ruleset required-status-check, produced
# here on the head SHA. There is no build/publish job in this gate - unit-test already builds the projects.
#
# No pull_request trigger: a fork PR cannot push to this repo, so it produces no run and cannot satisfy the
# required check. A maintainer lands such a contribution on an in-repo branch (which pushes, and so validates).
on:
  # All branches, but not tags.
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: checkout only. The Codecov upload uses CODECOV_TOKEN (not GITHUB_TOKEN).
permissions:
  contents: read

jobs:

  # `!github.event.deleted` skips a branch-deletion push (github.sha is all-zeros, so checkout/build fail).
  validate:
    name: Validate job
    if: ${{ !github.event.deleted }}
    uses: ./.github/workflows/validate-task.yml
    secrets: inherit

  # Reduced, never-published build of the release targets (executable subset + amd64 Docker image, no push) so a
  # PR exercises the reusable build pipeline. smoke: true hard-disables every publish path in build-release-task.
  smoke-build:
    name: Smoke build job
    if: ${{ !github.event.deleted }}
    uses: ./.github/workflows/build-release-task.yml
    secrets: inherit
    with:
      smoke: true
      github: false
      dockerhub: false
      branch: ${{ github.ref_name }}

  # Single required status check. Its name is the ruleset-bound context - do not rename without updating the
  # ruleset in lockstep. Must succeed, not merely not-fail.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [validate, smoke-build]
    if: ${{ always() && !github.event.deleted }}
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
